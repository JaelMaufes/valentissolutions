# Confere se o site compila antes de mesclar (a main publica direto no ar).
name: Verificar build
on:
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Conferir o link do Anille no resultado
        run: grep -rq "anille.sovalentis.com" dist/public/assets/
