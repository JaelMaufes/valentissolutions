# Confere se o site compila antes de mesclar (a main publica direto no ar).
name: Verificar build
on:
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Conferir que o site publicado não leva ferramentas do editor nem mapa do código
        run: |
          if grep -RIlE 'manus-runtime|__manus__|data-loc|%VITE_' dist/public; then echo "Ferramenta do editor ou marca do código no site publicado"; exit 1; fi
          test ! -e dist/public/__manus__
          grep -q 'anti-moldura' dist/public/index.html
      - name: Conferir o link do Anive no resultado
        run: grep -rq "anive.sovalentis.com" dist/public/assets/
      - name: Guardar o site compilado para conferência (3 dias)
        uses: actions/upload-artifact@v4
        with:
          name: site-compilado
          path: source/dist/public
          retention-days: 3
